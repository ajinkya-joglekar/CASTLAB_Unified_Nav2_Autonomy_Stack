# Nav2 configuration for the Wolf 6-wheel skid-steer robot (ROS 2 Jazzy)
# Converted from the supplied Ackermann vehicle configuration and updated
# using wolf.urdf.xacro + wolf_sensors.urdf.xacro.
#
# Wolf geometry used here:
#   wheel radius:      0.32029 m
#   wheel width:       0.30 m
#   wheel centers:     x = +/-0.6985 m, y = +/-0.5957 m
#   wheelbase:         1.397 m
#   wheel separation:  1.1914 m
#   chassis collision: 1.6 x 1.3 m
#
# Wheel collision geometry gives a ground envelope of approximately
# x=[-1.019, 1.019] m and y=[-0.746, 0.746] m. The front RGB-D camera
# protrudes to approximately x=1.13 m, so the footprint includes that
# front overhang. footprint_padding adds a further 5 cm safety margin.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    navigators: ["navigate_to_pose", "navigate_through_poses"]

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    error_code_name_prefixes:
      - compute_path
      - follow_path


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 5.0

    # Skid steer / differential drive: x and yaw only, no lateral velocity.
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01

    failure_tolerance: 0.5

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # Kept from the GPS/off-road Ackermann configuration.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      time_steps: 75
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1

      # ------------------------------------------------------------
      # SKID-STEER CHANGE
      # ------------------------------------------------------------
      # Jazzy MPPI uses DiffDrive for differential/skid-steer robots.
      # This allows zero-radius / in-place rotation and removes the
      # Ackermann minimum-turning-radius constraint.
      motion_model: "DiffDrive"

      vx_std: 0.2
      vy_std: 0.0
      wz_std: 1.5

      # Start conservatively and tune to the Wolf's actual actuator limits.
      # Keep vy = 0 for a skid-steer base.
      vx_max: 1.2
      vx_min: -1.2
      vy_max: 0.0
      wz_max: 2.0

      ax_max: 1.5
      ax_min: -3.5
      ay_max: 0.0
      ay_min: 0.0
      az_max: 4.0

      prune_distance: 1.5
      transform_tolerance: 0.3
      temperature: 0.5
      gamma: 0.015
      visualize: true
      regenerate_noises: true
      noise_decay_ratio: 0.95

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
        ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.75

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        near_collision_cost: 80
        critical_cost: 250.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 2.0
        trajectory_point_step: 2

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0          # Up from 8.0: Heavily penalizes trajectories drifting away from path heading
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 2
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      # 2. Boost PathFollowCritic to penalize physical distance from the line
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 30.0          # Up from 15.0: Forces the robot to physically hug the path
        offset_from_furthest: 5
        threshold_to_consider: 0.5

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.57
        mode: 1



local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05

      # Physical 2D envelope from the Wolf URDF. Front x includes the
      # RGB-D camera overhang; wheels determine the maximum lateral extent.
      footprint: "[[1.13, 0.746], [1.13, -0.746], [-1.019, -0.746], [-1.019, 0.746]]"
      footprint_padding: 0.02

      plugins: ["inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.8 
        cost_scaling_factor: 5.0 

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link

      update_frequency: 2.0
      publish_frequency: 1.0

      rolling_window: true
      width: 100
      height: 100
      resolution: 0.25

      track_unknown_space: true

      # Use the same physical footprint in both local and global costmaps.
      footprint: "[[1.13, 0.746], [1.13, -0.746], [-1.019, -0.746], [-1.019, 0.746]]"
      footprint_padding: 0.05

      plugins: ["inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.8
        cost_scaling_factor: 1.5
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 2.0

    GridBased:
      # ------------------------------------------------------------
      # SKID-STEER CHANGE
      # ------------------------------------------------------------
      # Remove Hybrid-A*/Dubins/minimum-turning-radius assumptions.
      # SmacPlanner2D is the simple drop-in global planner for a
      # differential/skid-steer base that can rotate in place.
      plugin: "nav2_smac_planner::SmacPlanner2D"

      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 5.0

      # Steer plans away from high-cost cells while preserving 2D planning.
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2


smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      refinement_num: 2
      # SmacPlanner2D has no explicit forward/reverse path inversions.
      enforce_path_inversion: false
      do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: true

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    # Spin is particularly useful for a skid-steer robot because it can
    # perform an in-place recovery rotation.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"
      acceleration_limit: 1.0
      deceleration_limit: -1.0
      minimum_speed: 0.1

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      acceleration_limit: 1.0
      deceleration_limit: -1.0
      minimum_speed: 0.1

    wait:
      plugin: "nav2_behaviors::Wait"

    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0

    max_rotational_vel: 2.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 6.0


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    # Differential/skid-steer Twist limits: [vx, vy, wz]
    max_velocity: [1.2, 0.0, 2.5]
    min_velocity: [-0.2, 0.0, -2.5]

    max_accel: [1.5, 0.0, 6.0]
    max_decel: [-1.5, 0.0, -6.0]

    odom_topic: /odometry/filtered
    odom_duration: 0.2

    deadband_velocity: [0.02, 0.0, 0.02]
    velocity_timeout: 1.0

    input_topic: cmd_vel_nav
    output_topic: cmd_vel


# Keep collision monitor configured, but do NOT include it in
# lifecycle_manager_navigation until core GPS navigation is working cleanly.
collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_link"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"

    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    polygons: ["FootprintApproach"]

    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.5
      enabled: true


lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true

    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
