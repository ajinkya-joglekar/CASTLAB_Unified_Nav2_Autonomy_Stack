bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    navigators: ["navigate_to_pose", "navigate_through_poses"]

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    error_code_name_prefixes:
      - compute_path
      - follow_path


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 5.0

    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01

    failure_tolerance: 0.5

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 1.5
      yaw_goal_tolerance: 1.00

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      time_steps: 72
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1

      motion_model: "Ackermann"

      AckermannConstraints:
        min_turning_r: 4.2

      vx_std: 0.4
      vy_std: 0.0
      wz_std: 0.35

      vx_max: 5.0
      vx_min: -1.5
      vy_max: 0.0
      wz_max: 0.8

      ax_max: 2.0
      ax_min: -1.5
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.0

      prune_distance: 3.0
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      visualize: true
      regenerate_noises: true

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic"
        ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.0

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        threshold_to_consider: 2.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        near_collision_cost: 200
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 2.0
        trajectory_point_step: 1

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        max_path_occupancy_ratio: 0.2
        trajectory_point_step: 4
        threshold_to_consider: 1.5
        offset_from_furthest: 20
        use_path_orientations: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 6
        threshold_to_consider: 2.0

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 6
        threshold_to_consider: 1.0
        max_angle_to_furthest: 1.57
        mode: 2


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 3.0
      publish_frequency: 2.0

      rolling_window: true
      width: 12
      height: 12
      resolution: 0.1

      footprint: "[[1.93, 0.79], [1.93, -0.79], [-1.93, -0.79], [-1.93, 0.79]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: points

        points:
          topic: /points
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 3.5
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          observation_persistence: 0.5
          expected_update_rate: 0.0
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 3.0
        cost_scaling_factor: 1.2

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link

      update_frequency: 2.0
      publish_frequency: 1.0

      rolling_window: true
      width: 100
      height: 100
      resolution: 0.25

      track_unknown_space: true

      footprint: "[[2.15, 0.95], [2.15, -0.95], [-2.15, -0.95], [-2.15, 0.95]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: points
        combination_method: 1

        points:
          topic: /points
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 3.5
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
          inf_is_valid: true
          # to help with ghosting
          observation_persistence: 0.3
          expected_update_rate: 0.15

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 3.0
        cost_scaling_factor: 1.2

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 2.0

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"

      tolerance: 2.0
      downsample_costmap: false
      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 5.0

      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72

      analytic_expansion_ratio: 2.5
      analytic_expansion_max_length: 10.0
      minimum_turning_radius: 5.0

      reverse_penalty: 3.0
      change_penalty: 0.2
      non_straight_penalty: 1.3
      cost_penalty: 8.0
      retrospective_penalty: 0.025

      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smooth_path: true


smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      refinement_num: 2
      enforce_path_inversion: true
      do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: true

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"
      acceleration_limit: 1.0
      deceleration_limit: -1.0
      minimum_speed: 0.1

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      acceleration_limit: 1.0
      deceleration_limit: -1.0
      minimum_speed: 0.1

    wait:
      plugin: "nav2_behaviors::Wait"

    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0

    max_rotational_vel: 0.8
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [2.0, 0.0, 0.8]
    min_velocity: [-0.5, 0.0, -0.8]

    max_accel: [1.5, 0.0, 1.0]
    max_decel: [-1.5, 0.0, -1.0]

    odom_topic: /odometry/filtered
    odom_duration: 0.2

    deadband_velocity: [0.02, 0.0, 0.02]
    velocity_timeout: 1.0
# Important:
    input_topic: cmd_vel_nav
    output_topic: cmd_vel


# Keep collision monitor configured, but do NOT include it in lifecycle_manager_navigation
# until core GPS navigation is working cleanly.
collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_link"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"

    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    polygons: ["FootprintApproach"]

    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.5
      enabled: true


lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true

    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      
